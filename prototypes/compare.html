<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>On Record — compare the three</title>
<style>
:root{--bg:#0B1A1C;--ink:#F2E7CC;--dim:rgba(242,231,204,.55);--line:rgba(242,231,204,.16);--hot:#FF6B52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 ui-sans-serif,-apple-system,"Space Grotesk",system-ui,sans-serif}
header{padding:18px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:18px;
  align-items:baseline;flex-wrap:wrap}
h1{font-size:17px;font-weight:500;margin:0}
header p{margin:0;color:var(--dim);font-size:13px}
button{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--ink);
  border-radius:999px;padding:6px 14px;cursor:pointer}
button:hover{border-color:var(--ink)}
#row{display:flex;gap:22px;padding:22px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 auto}
.cap{display:flex;align-items:baseline;gap:10px;margin:0 0 8px 2px}
.cap b{font-size:20px;font-weight:500}
.cap span{font-size:12px;color:var(--dim);font-family:ui-monospace,monospace}
.cap a{font-size:12px;color:var(--hot);margin-left:auto}
.frame{width:390px;height:844px;border:1px solid var(--line);border-radius:22px;overflow:hidden;
  background:#000}
iframe{width:390px;height:844px;border:0;display:block}
@media(max-width:1300px){#row{padding:14px}.frame,iframe{width:340px}}
</style></head><body>
<header>
  <h1>Three shapes, same data</h1>
  <p>Phone width, side by side. Scroll each one. The labels are blind until you ask.</p>
  <button id="reveal" type="button">Reveal which is which</button>
  <button id="reload" type="button">Reload all</button>
</header>
<div id="row"></div>
<script>
/* Blind by default and shuffled on every load: whichever you look at first sets your baseline,
   and knowing which one is recommended is exactly the bias worth removing. */
var SET=[{k:"p1",name:"Answer-first",note:"2 screens · your city is the whole first screen"},
         {k:"p2",name:"Five screens",note:"5 screens · one question each, numbered"},
         {k:"p3",name:"Report",note:"12 screens · findings box first, then sections"}];
for(var i=SET.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=SET[i];SET[i]=SET[j];SET[j]=t;}
var LET="ABC",row=document.getElementById("row");
SET.forEach(function(s,i){
  var c=document.createElement("div");c.className="col";
  c.innerHTML='<p class="cap"><b>'+LET[i]+'</b><span class="who" hidden>'+s.name+' &middot; '+s.note+'</span>'+
    '<a href="'+s.k+'.html" target="_blank" rel="noopener">open full &nearr;</a></p>'+
    '<div class="frame"><iframe src="'+s.k+'.html" loading="lazy" title="Prototype '+LET[i]+'"></iframe></div>';
  row.appendChild(c);});
document.getElementById("reveal").addEventListener("click",function(){
  [].forEach.call(document.querySelectorAll(".who"),function(e){e.hidden=!e.hidden;});
  this.textContent=document.querySelector(".who").hidden?"Reveal which is which":"Hide labels";});
document.getElementById("reload").addEventListener("click",function(){
  [].forEach.call(document.querySelectorAll("iframe"),function(f){f.src=f.src;});});
</script></body></html>
