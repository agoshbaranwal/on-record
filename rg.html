<iframe id="f" src="index.html?intro=0&live=0"></iframe>
<script>var f=document.getElementById("f");
f.onload=function(){setTimeout(function(){
 var d=f.contentDocument,w=f.contentWindow,o=[];

  document.title="G::"+o.join(" ~ ");},900);},1500);};
