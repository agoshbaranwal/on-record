<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:#111}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
var q=new URLSearchParams(location.search);
var W=+q.get("w")||2000,H=+q.get("h")||1300,t=q.get("t"),n=+(q.get("n")||0),intro=q.get("i")==="1";
var f=document.getElementById("f");f.style.width=W+"px";f.style.height=H+"px";
f.src="index.html?"+(intro?"":"intro=0&")+"live=0";
f.onload=function(){setTimeout(function(){var w=f.contentWindow,d=f.contentDocument;
 d.querySelectorAll(".beat,.pane-screen").forEach(function(b){b.classList.add("seen");});
 if(t){var p=d.getElementById(t);if(p){var beats=p.querySelectorAll(".beat");
  var b=beats[n]||beats[0]||p;w.scrollTo(0,(b.offsetTop||p.offsetTop));}}},1700);};
</script>
