<!doctype html><meta charset=utf-8>
<style>html,body{margin:0;background:#111}iframe{width:1995px;height:1295px;border:0}</style>
<iframe id="f" src="index.html"></iframe>
<script>var f=document.getElementById("f");
f.onload=function(){setTimeout(function(){var w=f.contentWindow,d=f.contentDocument;
 var ev=new w.WheelEvent("wheel",{deltaY:120,bubbles:true});
 w.dispatchEvent(ev);
 setTimeout(function(){
  var introGone=d.getElementById("intro").classList.contains("gone");
  var panesOp=w.getComputedStyle(d.getElementById("panes")).opacity;
  var g=d.getElementById("p-ground");g.scrollIntoView({block:"start"});
  setTimeout(function(){
   var sheet=g.querySelector(".sheet"),vis=0,tot=0;
   Array.prototype.forEach.call(sheet.children,function(c){tot++;
    if(parseFloat(w.getComputedStyle(c).opacity)>0.5)vis++;});
   document.title="SCR introGone_"+introGone+" panesOp_"+panesOp+" vis_"+vis+"of"+tot;
  },1500);},1200);},2500);};
</script>
