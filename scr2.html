<style>html,body{margin:0;background:#111}iframe{width:1995px;height:1295px;border:0}</style>
<iframe id="f" src="index.html"></iframe>
<script>var f=document.getElementById("f");
f.onload=function(){setTimeout(function(){var w=f.contentWindow,d=f.contentDocument;
 function wheel(){w.dispatchEvent(new w.WheelEvent("wheel",{deltaY:140,bubbles:true}));}
 wheel();
 setTimeout(function(){wheel();
  setTimeout(function(){
   var gone=d.getElementById("intro").classList.contains("gone");
   var op=w.getComputedStyle(d.getElementById("panes")).opacity;
   document.title="SC2 gone_"+gone+" panes_"+op;},1400);},1600);},2500);};
</script>
